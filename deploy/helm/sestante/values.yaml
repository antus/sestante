# Sestante su Kubernetes. Vedi deploy/helm/README.md.

# ── Indirizzo pubblico ─────────────────────────────────────────────────────────
# Tutto (app, Keycloak, relay) sta su <scheme>://<host>[:<port>]<appBase>.
host: sestante.example.org
scheme: https
# Porta pubblica, solo se non è quella standard dello schema (es. 9443 su kind).
port: ""
# Percorso dell'app: "/" oppure ad esempio "/sestante/". DEVE coincidere con
# l'APP_BASE con cui è stata costruita l'immagine: GeoLibre lo fissa nel build.
appBase: /

image:
  repository: sestante
  tag: latest
  pullPolicy: IfNotPresent
imagePullSecrets: []

# ── Sestante ───────────────────────────────────────────────────────────────────
sestante:
  allowLocalSignup: false
  orgDomain: example.org
  orgLabel: example.org
  # File caricati dagli utenti (GeoJSON). Con più repliche serve un volume
  # ReadWriteMany: con il default ReadWriteOnce la replica resta una.
  replicas: 1
  storage:
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  extraEnv: []

# Utente di default di Sestante (account locale), creato al primo avvio a
# database vuoto. Password vuota = generata dal chart e conservata nel Secret:
#   kubectl get secret <release>-sestante -o jsonpath='{.data.default-user-password}' | base64 -d
defaultUser:
  enabled: true
  email: admin@example.org
  name: Amministratore
  password: ""

# ── Segreti ────────────────────────────────────────────────────────────────────
# Vuoti = generati al primo `helm install` e conservati negli aggiornamenti.
# In alternativa un Secret esistente con le stesse chiavi (vedi templates/secret.yaml).
secrets:
  existingSecret: ""
  sessionSecret: ""
  collabIdentitySecret: ""
  keycloakClientSecret: ""
  keycloakAdminPassword: ""
  postgresPassword: ""

# ── PostgreSQL ─────────────────────────────────────────────────────────────────
postgresql:
  enabled: true
  image: postgres:17
  storage:
    size: 5Gi
    storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
  # Con enabled: false, un PostgreSQL esterno per Sestante (e per Keycloak):
  external:
    sestanteUrl: ""      # postgres://utente:password@host:5432/sestante
    keycloakJdbcUrl: ""  # jdbc:postgresql://host:5432/keycloak
    keycloakUser: keycloak

# ── Keycloak ───────────────────────────────────────────────────────────────────
keycloak:
  enabled: true
  image: quay.io/keycloak/keycloak:26.4
  adminUser: admin
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { memory: 1Gi }
  # Utente di prova nel realm importato (anna.verdi@example.org). Password
  # vuota = generata e conservata nel Secret (chiave demo-user-password).
  demoUser:
    enabled: true
    password: ""
  # Con enabled: false, un Keycloak (o altro OIDC) esterno:
  external:
    issuer: ""           # https://sso.example.org/realms/sestante
    clientId: sestante

# ── Relay di collaborazione ────────────────────────────────────────────────────
relay:
  enabled: true
  storage:
    size: 1Gi
    storageClass: ""
  resources:
    requests: { cpu: 50m, memory: 128Mi }

# ── Ingress ────────────────────────────────────────────────────────────────────
ingress:
  className: nginx
  annotations: {}
  tls:
    enabled: true
    # Secret TLS esistente (es. da cert-manager). Vuoto con selfSigned: true =
    # certificato autofirmato generato dal chart, per prove e reti interne.
    secretName: ""
    selfSigned: false
