{{- /*
I segreti dell'installazione. Con secrets.existingSecret si usa un Secret
creato a parte, che deve avere queste stesse chiavi.
*/ -}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sestante.fullname" . }}
  labels:
    {{- include "sestante.labels" . | nindent 4 }}
type: Opaque
stringData:
  session-secret: {{ include "sestante.secretValue" (dict "root" . "key" "session-secret" "value" .Values.secrets.sessionSecret) | quote }}
  collab-identity-secret: {{ include "sestante.secretValue" (dict "root" . "key" "collab-identity-secret" "value" .Values.secrets.collabIdentitySecret) | quote }}
  keycloak-client-secret: {{ include "sestante.secretValue" (dict "root" . "key" "keycloak-client-secret" "value" .Values.secrets.keycloakClientSecret) | quote }}
  keycloak-admin-password: {{ include "sestante.secretValue" (dict "root" . "key" "keycloak-admin-password" "value" .Values.secrets.keycloakAdminPassword) | quote }}
  postgres-password: {{ include "sestante.secretValue" (dict "root" . "key" "postgres-password" "value" .Values.secrets.postgresPassword) | quote }}
  default-user-password: {{ include "sestante.secretValue" (dict "root" . "key" "default-user-password" "value" .Values.defaultUser.password) | quote }}
  demo-user-password: {{ include "sestante.secretValue" (dict "root" . "key" "demo-user-password" "value" .Values.keycloak.demoUser.password) | quote }}
{{- end }}
