{{- if .Values.relay.enabled }}
{{- $name := printf "%s-relay" (include "sestante.fullname" .) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "sestante.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "sestante.selector" (dict "root" . "component" "relay") | nindent 4 }}
  ports:
    - name: http
      port: 8787
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels:
    {{- include "sestante.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.relay.storage.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.relay.storage.size }}
---
# Una replica sola: le sessioni vive stanno nella memoria del relay.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "sestante.labels" . | nindent 4 }}
    app.kubernetes.io/component: relay
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      {{- include "sestante.selector" (dict "root" . "component" "relay") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sestante.selector" (dict "root" . "component" "relay") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: { fsGroup: 1000 }
      containers:
        - name: relay
          # La stessa immagine di Sestante, con il relay di GeoLibre.
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", ".out/geolibre/relay/relay.cjs"]
          env:
            - { name: PORT, value: "8787" }
            - { name: HOST, value: "0.0.0.0" }
            - { name: COLLAB_DB_PATH, value: /data/collab.sqlite }
            - { name: TRUST_PROXY, value: "true" }
            - name: ALLOWED_ORIGINS
              value: {{ include "sestante.origin" . | quote }}
            - name: COLLAB_IDENTITY_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "sestante.secretName" . }}, key: collab-identity-secret } }
          ports:
            - { name: http, containerPort: 8787 }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.relay.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}
{{- end }}
